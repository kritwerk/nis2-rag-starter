[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nis2-rag-starter"
version = "0.1.0"
description = "RAG-Demo: NIS2-Policies durchsuchbar mit Quellen-Referenzen. Engineering-Demo von Kritwerk."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kritwerk", email = "kontakt@kritwerk.de" }]
keywords = ["nis2", "kritis", "rag", "compliance", "germany"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.3.0",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
nis2-rag = "nis2_rag.cli:app"

[project.urls]
Homepage = "https://kritwerk.de"
Repository = "https://github.com/kritwerk/nis2-rag-starter"

[tool.hatch.build.targets.wheel]
packages = ["src/nis2_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# B008: typer idiom; RUF001: allow German typography (en-dash, etc.) in strings.
ignore = ["E501", "B008", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# chromadb ships partial types — type: ignore comments may be needed in CI
# (where chromadb is installed) but not locally. Tolerate both.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["chromadb.*", "sentence_transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true
